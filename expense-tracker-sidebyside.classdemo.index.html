<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expenses Tracker — desktop and mobile demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0d1f3c;--navy2:#162d54;--gold:#b8892a;--gold2:#d4a847;
  --white:#fff;--off:#f8f8f6;--off2:#f0eff0;--line:#dde1e8;
  --ink2:#3d4f68;--ink3:#7a8799;--over:#9a6200;--green:#1a7a4a;
  --h1:#F7F3E9;--h2:#415A77;--h3:#1B263B;--h4:#0D1B2A;
  --hGold:#D4AF37;--hCream:#F7F3E9;
}
html,body{height:100%;overflow:hidden}
body{font-family:'Mulish',system-ui,sans-serif;background:#e8e9ec;color:var(--navy);
  display:grid;place-items:center}

/* ---------- rig ---------- */
.rig{display:flex;gap:30px;align-items:flex-start;transform-origin:center center}
.frame{border-radius:14px;overflow:hidden;background:var(--off);
  box-shadow:0 26px 70px rgba(13,31,60,.26),0 3px 10px rgba(13,31,60,.12)}

.desktop{width:1180px}
.chrome{height:38px;background:#e4e5e9;display:flex;align-items:center;gap:9px;
  padding:0 14px;border-bottom:1px solid #d2d4da}
.tl{display:flex;gap:6px}
.tl i{width:11px;height:11px;border-radius:50%;display:block}
.url{flex:1;background:#fff;border-radius:99px;height:23px;display:flex;align-items:center;
  padding:0 12px;font-size:11px;color:var(--ink3);gap:7px;max-width:430px;margin:0 auto}
.viewport{position:relative;height:712px;overflow:hidden;background:var(--off)}

.phone{width:372px;border-radius:44px;padding:11px;background:#11131a;
  box-shadow:0 26px 70px rgba(13,31,60,.3)}
.phone .screen{border-radius:34px;overflow:hidden;background:var(--off);position:relative}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:92px;height:24px;
  border-radius:99px;background:#11131a;z-index:40}
.statusbar{height:40px;display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;font-size:11.5px;font-weight:700;color:var(--navy);background:var(--off)}
.sigs{display:flex;gap:5px;align-items:center}
.sigs i{display:block;background:var(--navy);border-radius:1px}
.phone .viewport{height:684px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.homebar{height:22px;display:grid;place-items:center;background:var(--off)}
.homebar i{width:118px;height:4.5px;border-radius:99px;background:#c3c6cd;display:block}

.caption{position:absolute;top:-26px;left:2px;font-size:10px;letter-spacing:.16em;
  text-transform:uppercase;color:#8b8f99;font-weight:700}
.wrap{position:relative}

/* ---------- app ---------- */
.app{padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-height:100%}
.app h1,.serif{font-family:'Libre Baskerville',Georgia,serif}
.hd{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:8px}
.eyebrow{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:3px}
.app h1{font-weight:700;font-size:30px;line-height:1.05}
.demoTag{display:inline-block;font-size:7.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;
  background:var(--navy);color:var(--hCream);padding:3px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}
.totals{display:flex;gap:24px}
.tk{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.tv{font-family:'Libre Baskerville',Georgia,serif;font-size:21px;font-weight:700;line-height:1.2}
.pos{color:var(--green)}.neg{color:var(--over)}

.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--off2);border-radius:10px;padding:3px;gap:2px}
.seg button{font:inherit;font-size:11px;font-weight:600;color:var(--ink3);border:none;
  background:transparent;padding:5px 13px;border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--navy);box-shadow:0 1px 3px rgba(13,31,60,.14)}
.chip{font:inherit;font-size:10px;font-weight:700;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--white);color:var(--ink2);cursor:pointer}
.chip:hover{border-color:var(--gold)}

.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 262px;gap:13px}
.stage{min-height:0;display:flex}

.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr);
  gap:10px;width:100%;min-height:0}
.cat{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--white);
  padding:11px;display:flex;flex-direction:column;justify-content:space-between;min-height:100px;
  transition:transform .18s ease,box-shadow .18s ease;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.cat:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(13,31,60,.08)}
.peek{position:absolute;bottom:8px;right:10px;font-size:7.5px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);font-weight:700;opacity:0;transition:opacity .18s ease;z-index:2}
.cat:hover .peek{opacity:1}
.fill{position:absolute;left:0;right:0;bottom:0;opacity:.16;transition:height .5s cubic-bezier(.4,0,.2,1);z-index:0}
.cat>*:not(.fill){position:relative;z-index:1}
.ctop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.cat h2{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.spent{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;font-size:23px;line-height:1.05}
.meta{display:flex;justify-content:space-between;align-items:baseline;font-size:9.5px;color:var(--ink3);gap:6px}
.meta b{font-weight:700;color:var(--ink2)}
.cat.over{border-color:var(--over)}.cat.over .spent{color:var(--over)}
.flag{font-size:7.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#fff;
  background:var(--over);padding:2px 6px;border-radius:99px}
.cat.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(184,137,42,.5)}100%{box-shadow:0 0 0 15px rgba(184,137,42,0)}}

.txPanel{width:100%;display:flex;flex-direction:column;min-height:0;
  border:1px solid var(--line);border-radius:14px;background:var(--white);padding:14px}
.txHead{display:flex;align-items:flex-start;justify-content:space-between;gap:13px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.txTitle{display:flex;align-items:center;gap:8px}
.txTitle h2{font-family:'Libre Baskerville',Georgia,serif;font-size:19px;font-weight:700}
.txScope{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:4px}
.txSum{display:flex;gap:20px;font-size:9px;color:var(--ink3);flex-wrap:wrap}
.txSum b{display:block;font-size:12.5px;color:var(--navy);font-weight:700;font-family:'Libre Baskerville',Georgia,serif}
.txSum .hi{color:var(--over)}
.back{font:inherit;font-size:9.5px;font-weight:700;padding:5px 11px;border-radius:99px;
  border:1px solid var(--line);background:var(--white);color:var(--ink2);cursor:pointer}
.txScroll{flex:1;min-height:0;overflow-y:auto;margin-top:7px}
table.tx{width:100%;border-collapse:collapse;font-size:11px}
table.tx thead th{position:sticky;top:0;background:var(--white);text-align:left;font-size:8px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink3);font-weight:700;
  padding:6px 7px;border-bottom:1px solid var(--line)}
table.tx td{padding:6px 7px;border-bottom:1px solid var(--off2);color:var(--ink2)}
table.tx .amt{text-align:right;font-weight:700;color:var(--navy);white-space:nowrap}
table.tx .dte{white-space:nowrap;color:var(--ink3);font-weight:600}
table.tx .mth td{font-size:8px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);
  font-weight:700;background:var(--off)}
.txEmpty{padding:24px;text-align:center;color:var(--ink3);font-size:11px}
.del{font:inherit;font-size:9px;font-weight:700;padding:3px 8px;border-radius:99px;
  border:1px solid var(--line);background:var(--white);color:var(--ink3);cursor:pointer;white-space:nowrap}
.del:hover{border-color:var(--over);color:var(--over)}
.del.arm{background:var(--over);border-color:var(--over);color:#fff}
.delCell{width:80px;text-align:right}

.charts{display:grid;grid-template-columns:minmax(170px,.85fr) 1.15fr;gap:13px;width:100%;min-height:0}
.panelC{border:1px solid var(--line);border-radius:14px;background:var(--white);
  padding:13px;display:flex;flex-direction:column;min-height:0}
.panelC h3{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:9px}
.donutWrap{flex:1;display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:16px;min-height:0;align-content:center}
.donut{width:140px;aspect-ratio:1;border-radius:50%;position:relative;justify-self:center}
.donut::after{content:"";position:absolute;inset:26%;background:var(--white);border-radius:50%}
.donutMid{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:2}
.donutMid .n{font-family:'Libre Baskerville',Georgia,serif;font-size:14px;font-weight:700}
.donutMid .l{font-size:7.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.legend{display:grid;gap:4px;font-size:9.5px;min-width:0}
.legend div{display:flex;align-items:center;gap:6px;white-space:nowrap}
.legend i{width:8px;height:8px;border-radius:2px;flex:none}
.legend span{color:var(--ink3);margin-left:auto;font-weight:600}
.bars{display:grid;gap:7px;align-content:center;flex:1;min-height:0}
.bar b{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.track{height:9px;border-radius:99px;background:var(--off2);overflow:hidden;margin:3px 0 2px}
.val{height:100%;border-radius:99px;transition:width .5s ease}
.fig{font-size:8.5px;color:var(--ink3);display:flex;justify-content:space-between;gap:6px}

.mom{display:grid;grid-template-rows:1fr auto;gap:11px;width:100%;min-height:0}
.mapPanel,.detailPanel{border:1px solid var(--line);border-radius:14px;background:var(--white);
  padding:12px;display:flex;flex-direction:column;min-height:0}
.mapHead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:9px;flex-wrap:wrap}
.mapHead h3{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700}
.scaleKey{display:flex;align-items:center;gap:4px;font-size:8px;color:var(--ink3);font-weight:600;flex-wrap:wrap}
.scaleKey i{width:10px;height:10px;border-radius:3px;display:inline-block}
.map{flex:1;min-height:0;display:grid;grid-template-columns:auto repeat(12,1fr);gap:3px}
.mh{font-size:7.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);
  text-align:center;align-self:end;padding-bottom:2px}
.rowLbl{font-size:8.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);
  display:flex;align-items:center;gap:5px;padding-right:7px;white-space:nowrap;cursor:pointer;
  background:none;border:none;font-family:inherit;text-align:left}
.rowLbl.sel{color:var(--gold)}
.cell{border-radius:4px;cursor:pointer;position:relative;min-height:13px;border:1px solid rgba(13,27,42,.10);
  transition:transform .15s ease}
.cell.s1{background:var(--h1)}.cell.s2{background:var(--h2)}
.cell.s3{background:var(--h3)}.cell.s4{background:var(--h4)}
.cell.overb{background:var(--hGold);border-color:rgba(13,27,42,.25)}
.cell.empty{background:repeating-linear-gradient(45deg,#fff,#fff 4px,var(--off2) 4px,var(--off2) 8px);cursor:default}
.cell.peak{outline:2.5px solid var(--hCream);outline-offset:-4px}
.cell.peak.s1,.cell.peak.overb{outline-color:var(--h4)}
.cell:hover:not(.empty){transform:scale(1.1);z-index:3}

.detailPanel{gap:5px}
.detHead{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:7px}
.detHead h3{font-family:'Libre Baskerville',Georgia,serif;font-size:13.5px;font-weight:700}
.detStats{display:flex;gap:18px;font-size:9px;color:var(--ink3);flex-wrap:wrap}
.detStats b{display:block;font-size:11.5px;color:var(--navy);font-weight:700;font-family:'Libre Baskerville',Georgia,serif}
.detStats .hi{color:var(--over)}
.mbars{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:68px}
.mbar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:3px}
.mbar .b{border-radius:3px 3px 0 0;transition:height .4s ease;border:1px solid rgba(13,27,42,.12);border-bottom:none}
.mbar.s1 .b{background:var(--h1)}.mbar.s2 .b{background:var(--h2)}
.mbar.s3 .b{background:var(--h3)}.mbar.s4 .b{background:var(--h4)}
.mbar.overb .b{background:var(--hGold)}
.mbar.peak .b{box-shadow:inset 0 0 0 2.5px var(--hCream)}
.mbar.peak.s1 .b,.mbar.peak.overb .b{box-shadow:inset 0 0 0 2.5px var(--h4)}
.mbar .m{font-size:7px;text-align:center;color:var(--ink3);font-weight:700;text-transform:uppercase}
.mbar .v{font-size:7px;text-align:center;color:var(--ink2);font-weight:700}
.budgetLine{position:absolute;left:0;right:0;border-top:1px dashed var(--gold);z-index:2}

.rail{display:flex;flex-direction:column;gap:9px;min-height:0;overflow-y:auto}
.panel{border:1px solid var(--line);border-radius:14px;background:var(--white);padding:12px}
.panel h3{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink3);font-weight:700;margin-bottom:8px}
.opt{display:flex;align-items:center;gap:9px;width:100%;border:1px solid var(--line);border-radius:10px;
  background:var(--white);padding:8px 10px;cursor:pointer;font:inherit;font-size:11px;font-weight:700;
  color:var(--navy);text-align:left;margin-bottom:6px;transition:border-color .15s ease}
.opt:last-child{margin-bottom:0}
.opt:hover{border-color:var(--gold)}
.opt[aria-expanded="true"]{border-color:var(--gold)}
.opt .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;
  background:var(--off2);color:var(--navy)}
.opt small{display:block;font-weight:400;font-size:9px;color:var(--ink3);margin-top:1px;line-height:1.35}
.opt.rec .ic{background:#fdf3e3;animation:pulse 1.1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
.said{font-size:10.5px;color:var(--ink2);margin:0 0 6px;padding:7px 9px;background:var(--off2);border-radius:8px;min-height:29px}
.caret{display:inline-block;width:1px;background:var(--navy);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.fields select,.fields input{font:inherit;font-size:10.5px;padding:6px 7px;border:1px solid var(--line);
  border-radius:8px;background:var(--white);color:var(--navy);width:100%}
.wide{grid-column:1/-1}
.save{grid-column:1/-1;border:none;border-radius:8px;background:var(--navy);color:#fff;font:inherit;
  font-size:11px;font-weight:700;padding:8px;cursor:pointer}
.confirm{border:1.5px solid var(--gold);animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.why{font-size:9.5px;color:var(--ink3);line-height:1.45;margin-bottom:7px}
.crow{font-size:11px;font-weight:700;margin-bottom:7px}
.queued{font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.chipC{font:inherit;font-size:9.5px;font-weight:700;padding:4px 9px;border-radius:99px;
  border:1px solid var(--line);background:var(--white);color:var(--ink2);cursor:pointer}
.chipC[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.actions{display:flex;gap:6px}
.actions button{flex:1;font:inherit;font-size:10px;font-weight:700;padding:7px;border-radius:8px;
  cursor:pointer;border:1px solid var(--line);background:var(--white);color:var(--ink3)}
.actions .ok{background:var(--navy);color:#fff;border-color:var(--navy)}
.notice{padding:9px 12px;border-radius:10px;font-size:11px;font-weight:600;animation:slideIn .25s ease;
  background:#fdf3e3;border:1px solid var(--gold);color:var(--navy)}
.ft{display:flex;justify-content:space-between;font-size:9px;color:var(--ink3);
  border-top:1px solid var(--line);padding-top:6px;gap:9px;flex-wrap:wrap}

/* ---------- mobile overrides ---------- */
.m .app{padding:12px 13px;gap:9px}
.m .app h1{font-size:24px}
.m .hd{flex-direction:column;align-items:flex-start;gap:9px}
.m .totals{gap:16px;width:100%;justify-content:space-between}
.m .tv{font-size:17px}
.m .main{grid-template-columns:1fr;gap:11px}
.m .grid{grid-template-columns:repeat(2,1fr);grid-template-rows:none}
.m .cat{min-height:92px}
.m .spent{font-size:19px}
.m .charts{grid-template-columns:1fr}
.m .donut{width:120px}
.m .mom{grid-template-rows:none}
.m .map{min-height:200px}
.m .rail{overflow:visible}
.m .txScroll{max-height:280px}
.m .seg button{font-size:10.5px;padding:5px 11px}
.m .detStats{gap:12px}
.m .mbars{height:56px}

/* ---------- jar ---------- */
.loadWrap{margin:auto;display:flex;flex-direction:column;align-items:center;gap:15px}
.jar{position:relative;width:112px;height:127px}
.jarSvg{position:absolute;inset:0;width:112px}
.coin{position:absolute;top:2px;left:50%;margin-left:-8px;width:15px;height:15px;
  border-radius:50%;background:var(--gold2);border:2px solid var(--gold);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.4);
  animation:coinDrop 2.4s cubic-bezier(.55,0,.85,.6) infinite;opacity:0}
.coin:nth-of-type(2){animation-delay:.8s}
.coin:nth-of-type(3){animation-delay:1.6s}
@keyframes coinDrop{
  0%{transform:translateY(-8px) scale(.85);opacity:0}
  12%{opacity:1}
  46%{transform:translateY(24px) scale(1);opacity:1}
  56%{transform:translateY(32px) scale(.9);opacity:0}
  100%{transform:translateY(32px);opacity:0}
}
.contents{animation:fillUp 4.8s ease-in-out infinite}
@keyframes fillUp{
  0%{transform:translateY(74px)}8%{transform:translateY(74px)}
  70%{transform:translateY(0)}92%{transform:translateY(0)}100%{transform:translateY(74px)}
}
.loadTxt{font-size:9.5px;letter-spacing:.19em;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:center}
.loadTxt i{font-style:normal;animation:dim 1.5s ease-in-out infinite}
.loadTxt i:nth-child(2){animation-delay:.2s}
.loadTxt i:nth-child(3){animation-delay:.4s}
@keyframes dim{0%,100%{opacity:.3}50%{opacity:1}}
.scrim{position:absolute;inset:0;z-index:50;display:grid;place-items:center;
  background:rgba(248,248,246,.9);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
  animation:fadeIn .16s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}
  .contents{transform:translateY(0)!important}}
</style>
</head>
<body>

<div class="rig" id="rig">
  <div class="wrap">
    <span class="caption">Desktop</span>
    <div class="frame desktop">
      <div class="chrome">
        <div class="tl"><i style="background:#f05c54"></i><i style="background:#f5bf4f"></i><i style="background:#5ac05a"></i></div>
        <div class="url">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#7a8799" stroke-width="2.4">
            <rect x="4" y="10.5" width="16" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>
          expense-tracker-ai.vercel.app
        </div>
      </div>
      <div class="viewport" id="vpD"><div class="app" data-app="d"></div></div>
    </div>
  </div>

  <div class="wrap">
    <span class="caption">Mobile</span>
    <div class="frame phone">
      <div class="screen">
        <div class="island"></div>
        <div class="statusbar">
          <span>9:41</span>
          <span class="sigs">

<script>
/* ---------- constants ---------- */
const CATS=['Food','Groceries','Household','Subscriptions','Transport','Investment','Personal','Savings'];

const YEAR=2026,MONTH=6,ELAPSED=7,TODAY=22;

const SEED=[
  [402.10,366.50,448.90,289.30,512.40,287.00,296.40],
  [95.40,88.20,102.30,76.50,91.80,71.90,78.20],
  [42.00,18.50,55.20,9.00,31.40,20.00,12.00],

const MERCHANTS=[

  ['Singlife Elite Term','HSBC Life','Great Eastern Wealth Advantage'],
  ['Watsons','Guardian','Pickleball court','Barber','Uniqlo','Gift, birthday','Dental checkup','Kinokuniya'],

const FIXED=[false,false,false,true,false,true,false,true];

/* ---------- scripted AI ---------- */
const VOICE_SCRIPT=[

   entries:[{cat:0,amount:50,note:'Lunch'}]},

/* ---------- state ---------- */
let M,INC,TX,period='month',view='grid',sel=0,catView=0,
    voiceIdx=0,recIdx=0,busy=false,pending=null,queue=[],armed=null,
    typeOpen=false,typeKind='Expense',said='',saidLive=false,notceMsg='';

const money=n=>'S$'+Number(n||0).toLocaleString('en-SG',{minimumFractionDigits:2,maximumFractionDigits:2});
const band=(v,min,span)=>{const r=(v-min)/(span||1);return r<0.25?'s1':r<0.55?'s2':r<0.85?'s3':'s4'};
const $$=s=>[...document.querySelectorAll(s)];

function genTx(){
  const out=[];
  for(let i=0;i<CATS.length;i++)for(let m=0;m<ELAPSED;m++){
    const total=SEED[i][m]; if(!total) continue;
    const list=MERCHANTS[i];
    const n=FIXED[i]?Math.min(list.length,i===3?4:i===5?3:1)
                    :Math.min(list.length,4+Math.floor(Math.random()*3));
    const w=Array.from({length:n},()=>0.4+Math.random());
    const sum=w.reduce((a,b)=>a+b,0);
    let run=0;
    for(let k=0;k<n;k++){
      let amt=k===n-1?+(total-run).toFixed(2):+((total*w[k]/sum)).toFixed(2);
      run=+(run+amt).toFixed(2);
      if(amt<=0) continue;
      const day=m===MONTH?1+Math.floor(Math.random()*TODAY):1+Math.floor(Math.random()*27);
      out.push({cat:i,month:m,day,amount:amt,note:list[k%list.length]});
    }
  }
  return out.sort((a,b)=>b.month-a.month||b.day-a.day);
}

function seed(){
  M=SEED.map(r=>[...r,0,0,0,0,0]);
  INC=[...SEED_INCOME,0,0,0,0,0];
  TX=genTx();
  period='month';view='grid';sel=0;catView=0;
  voiceIdx=0;recIdx=0;busy=false;pending=null;queue=[];armed=null;
  typeOpen=false;typeKind='Expense';said='';saidLive=false;notceMsg='';
}

/* ---------- jar ---------- */
const jar=id=>`

<svg class="jarSvg" viewBox="0 0 120 136" fill="none">

    <ellipse cx="64" cy="118" rx="10" ry="5.4" fill="#fdf3e3" stroke="#b8892a" stroke-width="2.4"/>
    <ellipse cx="80" cy="115" rx="9" ry="5" fill="#fdf3e3" stroke="#b8892a" stroke-width="2.4"/>
    <ellipse cx="38" cy="107" rx="9" ry="5" fill="#fdf3e3" stroke="#b8892a" stroke-width="2.4"/>

    <ellipse cx="42" cy="66" rx="9" ry="5" fill="#fdf3e3" stroke="#b8892a" stroke-width="2.4"/>

  </g></g>
  <path d="M30 44 L30 108 Q30 124 46 124 L74 124 Q90 124 90 108 L90 44"
    stroke="#0d1f3c" stroke-width="3.6" stroke-linecap="round" fill="none"/>
  <path d="M30 44 L90 44" stroke="#0d1f3c" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M40 56 L40 100" stroke="#dde1e8" stroke-width="3" stroke-linecap="round"/>
</svg>`;

const ICONS={
 mic:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
   <path d="M10.4 2.2C6.6 2.2 3.5 5.3 3.5 9.1c0 1.8.5 3 1.3 4.2l1.1 1.7c.2.3.3.6.3 1v4.6c0 .6.4 1 1 1h4.6c.6 0 1-.4 1-1v-2.3h1.1c.6 0 1-.5.9-1l-.2-1.9 1.4-.6c.4-.2.6-.6.4-1l-1.4-2.9c0-4.4-1.2-8.7-4.6-8.7Z" fill="currentColor" stroke="none"/>
   <path d="M18.6 8.6a5.6 5.6 0 0 1 0 6.8"/><path d="M21.3 6.4a9.4 9.4 0 0 1 0 11.2"/></svg>`,

 key:`<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">

};

/* ---------- overlay ---------- */
function scrim(label){
  ['vpD','vpM'].forEach((id,k)=>{
    const d=document.createElement('div');
    d.className='scrim';
    d.innerHTML=`<div class="loadWrap"><div class="jar">${jar('s'+k)}</div>
      <p class="loadTxt">${label}<i>.</i><i>.</i><i>.</i></p></div>`;
    document.getElementById(id).appendChild(d);
  });
}
const unscrim=()=>$$('.scrim').forEach(s=>s.remove());

/* ---------- data ---------- */
function current(){
  if(period==='month') return {income:INC[MONTH],budget:MB,spent:CATS.map((_,i)=>M[i][MONTH]),
    label:`Personal finance · Singapore · ${MONTHS[MONTH]} ${YEAR}`,foot:`8 categories · resets 1 ${MONTHS[MONTH+1]}`};
  return {income:INC.slice(0,ELAPSED).reduce((a,b)=>a+b,0),budget:MB.map(b=>b*ELAPSED),
    spent:CATS.map((_,i)=>M[i].slice(0,ELAPSED).reduce((a,b)=>a+b,0)),
    label:`Personal finance · Singapore · ${YEAR} year to date`,foot:`8 categories · Jan–Jul ${YEAR}`};
}

/* ---------- fragments ---------- */
function gridHTML(d,flash){
  return '<div class="grid">'+CATS.map((c,i)=>{
    const pct=Math.round(d.spent[i]/d.budget[i]*100),over=d.spent[i]>d.budget[i];
    return `<button class="cat${over?' over':''}${i===flash?' flash':''}" data-act="cat" data-i="${i}">
      <div class="fill" style="height:${Math.min(pct,100)}%;background:${TINTS[i]}"></div>
      <div class="ctop"><span class="dot" style="background:${TINTS[i]}"></span><h2>${c}</h2>${over?'<span class="flag">over</span>':''}</div>
      <p class="spent">${money(d.spent[i])}</p>
      <span class="peek">View entries →</span>
      <div class="meta"><span>of <b>${money(d.budget[i])}</b>${over?' · '+money(d.spent[i]-d.budget[i])+' over':''}</span>
      <span style="font-weight:700">${pct}%</span></div></button>`;}).join('')+'</div>';
}

function txHTML(i){
  const inMonth=period==='month';
  const rows=TX.map((t,k)=>({...t,id:k})).filter(t=>t.cat===i&&(inMonth?t.month===MONTH:t.month<ELAPSED))
    .sort((a,b)=>b.month-a.month||b.day-a.day);
  const budget=inMonth?MB[i]:MB[i]*ELAPSED;
  const spent=rows.reduce((a,t)=>a+t.amount,0),over=spent>budget;
  const largest=rows.length?Math.max(...rows.map(r=>r.amount)):0;
  let body='',lastM=-1;
  if(!rows.length) body=`<tr><td colspan="4"><p class="txEmpty">No entries recorded in this period.</p></td></tr>`;
  else rows.forEach(t=>{
    if(!inMonth&&t.month!==lastM){
      lastM=t.month;
      const mt=rows.filter(r=>r.month===lastM).reduce((a,r)=>a+r.amount,0);
      body+=`<tr class="mth"><td colspan="2">${MONTHS[lastM]} ${YEAR}</td>
        <td style="text-align:right">${money(mt)}</td><td></td></tr>`;
    }
    body+=`<tr><td class="dte">${String(t.day).padStart(2,'0')} ${MONTHS[t.month]}</td>
      <td>${t.note}</td><td class="amt">${money(t.amount)}</td>
      <td class="delCell"><button class="del${armed===t.id?' arm':''}" data-act="del" data-id="${t.id}">${armed===t.id?'Confirm':'Delete'}</button></td></tr>`;
  });
  return `<div class="txPanel"><div class="txHead">
    <div><div class="txTitle"><span class="dot" style="background:${TINTS[i]};width:11px;height:11px"></span>
      <h2>${CATS[i]}</h2></div>
      <p class="txScope">${inMonth?MONTHS[MONTH]+' '+YEAR:'Jan–'+MONTHS[MONTH]+' '+YEAR} · ${rows.length} ${rows.length===1?'entry':'entries'}</p></div>
    <div style="display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap">
      <div class="txSum">
        <div>Spent<b class="${over?'hi':''}">${money(spent)}</b></div>
        <div>Budget<b>${money(budget)}</b></div>
        <div>${over?'Over by':'Remaining'}<b class="${over?'hi':''}">${money(Math.abs(budget-spent))}</b></div>
        <div>Largest<b>${largest?money(largest):'—'}</b></div></div>
      <button class="back" data-act="back">← All categories</button></div></div>
    <div class="txScroll"><table class="tx">
      <thead><tr><th style="width:76px">Date</th><th>Detail</th>
      <th style="text-align:right;width:92px">Amount</th><th style="width:80px"></th></tr></thead>
      <tbody>${body}</tbody></table></div></div>`;
}

function chartsHTML(d,total){
  let acc=0;
  const stops=CATS.map((c,i)=>{const f=acc;acc+=d.spent[i]/total*100;
    return `${TINTS[i]} ${f.toFixed(2)}% ${acc.toFixed(2)}%`}).join(',');
  const legend=CATS.map((c,i)=>({c,i,p:d.spent[i]/total*100})).sort((a,b)=>b.p-a.p).slice(0,5)
    .map(o=>`<div><i style="background:${TINTS[o.i]}"></i>${o.c}<span>${o.p.toFixed(1)}%</span></div>`).join('');
  const bars=CATS.map((c,i)=>{const pct=d.spent[i]/d.budget[i]*100,over=pct>100;
    return `<div class="bar"><b>${c}</b><div class="track">
      <div class="val" style="width:${Math.min(pct,100)}%;background:${over?'#9a6200':TINTS[i]}"></div></div>
      <div class="fig"><span>${money(d.spent[i])} of ${money(d.budget[i])}</span><span>${Math.round(pct)}%</span></div></div>`}).join('');
  return `<div class="charts">
    <div class="panelC"><h3>Where it went</h3><div class="donutWrap">
      <div class="donut" style="background:conic-gradient(${stops})">
      <div class="donutMid"><p class="n">${money(total)}</p><p class="l">total</p></div></div>
      <div class="legend">${legend}</div></div></div>
    <div class="panelC"><h3>Budget vs actual</h3><div class="bars">${bars}</div></div></div>`;
}

function momHTML(){
  const head=['<span></span>',...MONTHS.map(m=>`<span class="mh">${m}</span>`)].join('');
  const rows=CATS.map((c,i)=>{
    const vals=M[i].slice(0,ELAPSED),max=Math.max(...vals),min=Math.min(...vals),peak=vals.indexOf(max);
    const cells=MONTHS.map((m,j)=>{
      if(j>=ELAPSED) return '<div class="cell empty"></div>';
      const v=M[i][j];
      const cls=['cell',band(v,min,max-min),j===peak?'peak':'',v>MB[i]?'overb':''].filter(Boolean).join(' ');
      return `<div class="${cls}" data-act="mom" data-cat="${i}" title="${c} · ${m} ${YEAR}: ${money(v)}${v>MB[i]?' · over budget':''}"></div>`;
    }).join('');
    return `<button class="rowLbl${i===sel?' sel':''}" data-act="mom" data-cat="${i}">
      <span class="dot" style="background:${TINTS[i]}"></span>${c}</button>${cells}`}).join('');
  return `<div class="mom"><div class="mapPanel">
    <div class="mapHead"><h3>Month on month · shading is relative to each row</h3>
    <span class="scaleKey">
      <i style="background:#F7F3E9;border:1px solid rgba(13,27,42,.15)"></i><i style="background:#415A77"></i>
      <i style="background:#1B263B"></i><i style="background:#0D1B2A"></i> light → heavy
      &nbsp;·&nbsp;<i style="background:#D4AF37"></i> over budget
      &nbsp;·&nbsp;<i style="background:#0D1B2A;outline:2.5px solid #F7F3E9;outline-offset:-4px"></i> peak</span></div>
    <div class="map">${head}${rows}</div></div>
    <div class="detailPanel">${detailHTML(sel)}</div></div>`;
}

function detailHTML(i){
  const vals=M[i].slice(0,ELAPSED),max=Math.max(...vals),min=Math.min(...vals);
  const peak=vals.indexOf(max),total=vals.reduce((a,b)=>a+b,0);
  const overM=vals.filter(v=>v>MB[i]).length;
  const bars=MONTHS.map((m,j)=>{
    if(j>=ELAPSED) return `<div class="mbar"><div class="b" style="height:2px;background:#f0eff0"></div><span class="m">${m}</span></div>`;
    const v=M[i][j],h=Math.max(4,v/max*100);
    const cls=['mbar',band(v,min,max-min),j===peak?'peak':'',v>MB[i]?'overb':''].filter(Boolean).join(' ');
    return `<div class="${cls}"><span class="v">${Math.round(v)}</span>
      <div class="b" style="height:${h}%"></div><span class="m">${m}</span></div>`}).join('');
  return `<div class="detHead"><h3>${CATS[i]}</h3><div class="detStats">
    <div>Peak<b>${MONTHS[peak]} · ${money(max)}</b></div>
    <div>Monthly average<b>${money(total/ELAPSED)}</b></div>
    <div>Budget<b>${money(MB[i])}</b></div>
    <div>Months over<b class="${overM?'hi':''}">${overM} of ${ELAPSED}</b></div></div></div>
    <div style="position:relative">
    <div class="budgetLine" style="bottom:calc(${Math.min(100,MB[i]/max*100)}% - 13px)"></div>
    <div class="mbars">${bars}</div></div>`;
}

function railHTML(){
  const v=VOICE_SCRIPT[voiceIdx];
  const micLbl=saidLive?'Listening…<small>Speak now</small>'
    :`Speak it<small>“${v.phrase}”</small>`;
  const saidBlock=said?`<div class="said">${said}${saidLive?'<span class="caret">&nbsp;</span>':''}</div>`+
    (saidLive?'':`<button class="opt" data-act="voiceSave"><span class="ic">✓</span><span>Save what I said</span></button>`):'';

  const typeBlock=typeOpen?`<form class="fields" data-act="mform">
      <input type="date" value="2026-07-22">
      <select data-act="mtype"><option ${typeKind==='Expense'?'selected':''}>Expense</option><option ${typeKind==='Income'?'selected':''}>Income</option></select>
      <select class="wide" data-f="cat">${(typeKind==='Income'?INCOME_CATS:CATS).map((c,k)=>`<option value="${k}">${c}</option>`).join('')}</select>
      <input class="wide" type="number" step="0.01" placeholder="Amount (S$)" data-f="amt">
      <input class="wide" type="text" placeholder="Notes (optional)" data-f="note">
      <button class="save" type="submit">Save entry</button></form>`:'';

  let confirmBlock='';
  if(pending){
    const opts=[pending.cat,...pending.alts];
    confirmBlock=`<div class="panel confirm">
      <h3>Check this one</h3>
      ${queue.length?`<p class="queued">${queue.length} more waiting</p>`:''}
      <p class="why">${pending.reason}</p>
      <p class="crow">${money(pending.amount)} · ${TODAY} ${MONTHS[MONTH]} · ${pending.note}</p>
      <div class="chips">${opts.map(c=>
        `<button class="chipC" data-act="pcat" data-c="${c}" aria-pressed="${c===pending.cat}">${CATS[c]}</button>`).join('')}</div>
      <select data-act="psel" style="font-size:10.5px;padding:6px 7px;border:1px solid #dde1e8;border-radius:8px;width:100%;margin-bottom:8px">
        ${CATS.map((c,k)=>`<option value="${k}" ${k===pending.cat?'selected':''}>${c}</option>`).join('')}</select>
      <div class="actions"><button class="ok" data-act="pok">Save</button><button data-act="pno">Discard</button></div></div>`;
  }

  return `<div class="panel">
      <h3>Add an entry</h3>
      <button class="opt${saidLive?' rec':''}" data-act="mic"><span class="ic">${ICONS.mic}</span><span>${micLbl}</span></button>
      ${saidBlock}
      <button class="opt" data-act="cam"><span class="ic">${ICONS.cam}</span><span>Snap it<small>Reads merchant, total and date</small></span></button>
      <button class="opt" data-act="type" aria-expanded="${typeOpen}"><span class="ic">${ICONS.key}</span><span>Type it<small>Enter the details yourself</small></span></button>
      ${typeBlock}
    </div>${confirmBlock}`;
}

/* ---------- full render ---------- */
function render(flash){
  const d=current(),total=d.spent.reduce((a,b)=>a+b,0),net=d.income-total;
  const opts=period==='year'?[['grid','Categories'],['charts','Charts'],['mom','Month on month']]
    :[['grid','Categories'],['charts','Charts']];
  if(!opts.some(o=>o[0]===view)&&view!=='cat') view='grid';

  const stage=view==='cat'?txHTML(catView)
    :view==='grid'?gridHTML(d,flash)
    :view==='charts'?chartsHTML(d,total):momHTML();

  const html=`
    <div class="hd">
      <div><p class="eyebrow">${d.label}</p>
        <h1>Expenses Tracker<span class="demoTag">demo</span></h1></div>
      <div class="totals">
        <div><p class="tk">Income</p><p class="tv">${money(d.income)}</p></div>
        <div><p class="tk">Spent</p><p class="tv">${money(total)}</p></div>
        <div><p class="tk">Left over</p><p class="tv ${net>=0?'pos':'neg'}">${money(net)}</p></div></div>
    </div>
    <div class="controls">
      <div class="seg">${opts.map(([v,l])=>`<button data-act="view" data-view="${v}" aria-pressed="${v===view}">${l}</button>`).join('')}</div>
      <div class="seg">
        <button data-act="period" data-period="month" aria-pressed="${period==='month'}">This Month</button>
        <button data-act="period" data-period="year" aria-pressed="${period==='year'}">This Year</button></div>
      <button class="chip" data-act="reset" style="margin-left:auto">Reset demo</button>
    </div>
    ${notceMsg?`<div class="notice">${notceMsg}</div>`:''}
    <div class="main">
      <section class="stage">${stage}</section>
      <aside class="rail">${railHTML()}</aside>
    </div>
    <div class="ft"><span>${d.foot}</span><span>Synthetic data · nothing leaves this page</span></div>`;

  $$('.app').forEach(a=>a.innerHTML=html);
}

/* ---------- actions ---------- */
function commit(list){
  list.forEach(e=>{
    M[e.cat][MONTH]+=e.amount;
    TX.unshift({cat:e.cat,month:MONTH,day:TODAY,amount:e.amount,note:e.note||'Added just now'});
  });
  const last=list[list.length-1];
  if(list.length>1){
    notceMsg='Saved '+list.length+' entries — '+list.map(e=>CATS[e.cat]+' '+money(e.amount)).join(', ')+'.';
  }else{
    const i=last.cat,spent=M[i][MONTH],pct=Math.round(spent/MB[i]*100);
    notceMsg = pct>=100?`${CATS[i]} is over budget — ${money(spent)} of ${money(MB[i])} (${pct}%).`
      :pct>=80?`${CATS[i]} is at ${pct}% of budget — ${money(spent)} of ${money(MB[i])}.`
      :`Saved. ${CATS[i]}: ${money(spent)} of ${money(MB[i])} (${pct}%).`;
  }
  render(last.cat);
}

function commitIncome(amount,label){
  INC[MONTH]+=amount;
  notceMsg=`Saved. ${money(amount)} recorded as ${label}.`;
  render();
}

function nextPending(){
  pending=queue.shift()||null;
  render();
}

const act={
  view(el){view=el.dataset.view;render()},
  period(el){period=el.dataset.period;if(view==='mom'&&period==='month')view='grid';render()},
  reset(){scrim('Counting your coins');setTimeout(()=>{unscrim();seed();render()},1500)},
  cat(el){catView=+el.dataset.i;armed=null;view='cat';render()},
  back(){armed=null;view='grid';render()},
  mom(el){sel=+el.dataset.cat;render()},
  del(el){
    const id=+el.dataset.id;
    if(armed!==id){armed=id;render();return}
    const t=TX[id];armed=null;
    scrim('Fishing that one out');
    setTimeout(()=>{
      M[t.cat][t.month]-=t.amount;TX.splice(id,1);
      notceMsg=`Removed ${money(t.amount)} from ${CATS[t.cat]}.`;
      unscrim();render();
    },1100);
  },
  mic(){
    if(busy||saidLive) return; busy=true;
    const item=VOICE_SCRIPT[voiceIdx];
    said='';saidLive=true;notceMsg='';render();
    let k=0;
    const t=setInterval(()=>{
      said=item.phrase.slice(0,++k);
      $$('.said').forEach(s=>s.innerHTML=said+'<span class="caret">&nbsp;</span>');
      if(k>=item.phrase.length){clearInterval(t);saidLive=false;busy=false;render()}
    },46);
  },
  voiceSave(){
    if(busy) return; busy=true;
    const item=VOICE_SCRIPT[voiceIdx];
    said='';render();
    scrim('Listening back');
    setTimeout(()=>{
      unscrim();busy=false;
      voiceIdx=(voiceIdx+1)%VOICE_SCRIPT.length;
      if(item.income){commitIncome(item.income.amount,item.income.label);return}
      if(item.entries) commit(item.entries);
      if(item.low){queue=item.low.map(o=>({...o}));nextPending()}
      else render();
    },1000);
  },
  cam(){
    if(busy) return; busy=true;
    const item=RECEIPT_SCRIPT[recIdx];
    notceMsg='';
    scrim('Squinting at the receipt');
    setTimeout(()=>{
      unscrim();busy=false;
      recIdx=(recIdx+1)%RECEIPT_SCRIPT.length;
      if(item.entries) commit(item.entries);
      if(item.low){queue=item.low.map(o=>({...o}));nextPending()}
      else render();
    },1500);
  },
  type(){typeOpen=!typeOpen;render()},
  pcat(el){pending.cat=+el.dataset.c;render()},
  pok(){
    const p=pending;pending=null;render();
    scrim('Into the jar');
    setTimeout(()=>{unscrim();commit([{cat:p.cat,amount:p.amount,note:p.note}]);
      if(queue.length) nextPending();},900);
  },
  pno(){pending=null;notceMsg='Discarded. Nothing was saved.';
    if(queue.length) nextPending(); else render();}
};

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  const fn=act[el.dataset.act];
  if(fn){e.preventDefault();fn(el)}
});

document.addEventListener('change',e=>{
  const el=e.target.closest('[data-act]');
  if(!el) return;
  if(el.dataset.act==='psel'){pending.cat=+el.value;render()}
  if(el.dataset.act==='mtype'){typeKind=el.value;render()}
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-act="mform"]');
  if(!f) return;
  e.preventDefault();
  const amt=parseFloat(f.querySelector('[data-f="amt"]').value);
  if(!amt) return;
  const catIdx=+f.querySelector('[data-f="cat"]').value;
  const note=f.querySelector('[data-f="note"]').value||'Manual entry';
  scrim('Into the jar');
  setTimeout(()=>{
    unscrim();
    if(typeKind==='Income') commitIncome(amt,INCOME_CATS[catIdx]);
    else commit([{cat:catIdx,amount:amt,note}]);
  },800);
});

/* ---------- fit ---------- */
function fit(){
  const rig=document.getElementById('rig');
  const natural=1180+30+372;
  const s=Math.min(1,(window.innerWidth-56)/natural,(window.innerHeight-60)/770);
  rig.style.transform=`scale(${s})`;
}
window.addEventListener('resize',fit);

/* ---------- boot ---------- */
seed();render();fit();
scrim('Counting your coins');
setTimeout(unscrim,2600);
</script>
</body>
</html>
